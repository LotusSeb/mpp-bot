name: MPP Bot - Pronostics Ligue 1

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  pronostics:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install Chrome and ChromeDriver
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser chromium-chromedriver
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run MPP Bot
        env:
          MPP_LOGIN: ${{ secrets.MPP_LOGIN }}
          MPP_PASSWORD: ${{ secrets.MPP_PASSWORD }}
          FOOTBALL_API_TOKEN: ${{ secrets.FOOTBALL_API_TOKEN }}
        run: |
          python mpp_bot.py
      
      - name: Notify on success
        if: success()
        run: echo "✅ Pronostics soumis avec succès!"
      
      - name: Notify on failure
        if: failure()
        run: echo "❌ Erreur lors de la soumission"
